<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>

        <div class="container">
            <div id="home-sec">
                <h3>HOME</h3>
                <p id="home-score-el">0</p>
                <div class="btn">
                <button id="home+1-btn" onclick="add1home()">+1</button>
                <button id="home+2-btn" onclick="add2home()">+2</button>
                <button id="home+3-btn" onclick="add3home()">+3</button>
                </div>
            </div>
            <div id="logo section">
                <img id="logo" src="nba-logo.png" alt="NBA logo">
            </div>
            <div id="guest-sec">
                <h3>GUEST</h3>
                <p id="guest-score-el">0</p>
                <div class="btn">
                <button id="guest+1-btn" onclick="add1guest()">+1</button>
                <button id="guest+2-btn" onclick="add2guest()">+2</button>
                <button id="guest+3-btn" onclick="add3guest()">+3</button>
                </div>
            </div>
        </div>
        <div>
            
        </div>
        <div id="new-game">
            <button id="new-game-btn" onclick="newgame()">NEW GAME</button>
        </div>
        <script src="index.js"></script>
    </body>
</html>
